services:
  db:
    image: postgres:14-alpine
    restart: always
    ports:
      - '${DATASOURCE_PORT}:5432'
    environment:
      POSTGRES_DB: ${DATASOURCE_DATABASE}
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
    networks:
      - database
    volumes:
      - .postgres-data:/var/lib/postgresql/data
networks:
  database:
    driver: bridge
