name: pre-merge.yml

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"

concurrency:
  group: pre-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            test

  lint-types:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('packages/**') }}
          restore-keys: turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun --filter "./packages/**" build
      - run: bun lint
      - run: bun check-types

  test-web:
    name: Test (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('packages/**') }}
          restore-keys: turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun --filter "./packages/**" build
      - run: bun --filter @finiq/web test

  test-api:
    name: Test (apps/api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('packages/**') }}
          restore-keys: turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun --filter "./packages/**" build
      - run: bun --filter @finiq/api test

  test-i18n-static:
    name: Test (apps/i18n-static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('packages/**') }}
          restore-keys: turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun --filter "./packages/**" build
      - run: bun --filter @finiq/i18n-static test

  build:
    name: Build
    needs: [lint-types, test-web, test-api, test-i18n-static]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('packages/**') }}
          restore-keys: turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://placeholder.example.com' }}
          NEXT_PUBLIC_I18N_URL: ${{ secrets.NEXT_PUBLIC_I18N_URL || 'https://placeholder.example.com' }}
